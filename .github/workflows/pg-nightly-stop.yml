name: PG Nightly Stop/Start

# B1ms 24/7 → 야간 정지로 컴퓨트 비용 ~33% 절감 (전략 §3-A)
#
# [2026-08-07 주의] 현재 이 워크플로의 실제 절감액은 ₩0 이다. 구독의 freetier
#   프로모션(만료 2027-05-27)이 B1ms 컴퓨트 월 750시간을 무료로 덮는데, 31일 달이
#   744시간이라 24/7 로 켜둬도 한도 안에 들어오기 때문이다. 절감액이 월 ₩9,895 로
#   살아나는 시점은 프로모션 만료 이후다. 그때까지는 자산 보존 목적으로만 유지한다.
#   따라서 이 워크플로의 실패는 요금에 영향이 없으므로 긴급 대응 대상이 아니다.
#   근거·수치·만료 대응: docs/plans/strategic/azure-freetier-cliff-2027.md
#
# [2026-10-11 일정 정지 중지] 일정 실행의 stop job 은 저장소 변수 PG_NIGHTLY_ENABLED 가 'true' 일 때만 돈다.
#   변수가 없는 기본 상태가 꺼짐이다. 실측상 정지 cron 은 KST 04~05시, 기동 cron 의 첫 실행은
#   10:31~11:42 에 돌아 PG 가 매일 오전 11시 반 무렵까지 Stopped 였다. 비밀값 주입으로 PG 연결이 살아나면
#   그 시간대 PG 기능이 멈추는데, 무료 기간 절감액은 ₩0 이라 손해만 남는다.
#   되살릴 때는 이 변수로 켜지 말고 Azure Automation 일정으로 옮긴다(cron 지연이 그대로이므로).
#   변수는 수동 점검이나 긴급 시 임시로 켜는 용도다. start job 은 Stopped 일 때만 동작하므로 그대로 둔다.
#   근거: docs/plans/strategic/maintenance-mode-low-cost-ops.md 결함 (B), 권고 R2
#
# 정지: 매일 KST 24:00 (= UTC 15:00)
# 기동: 매일 KST 08:00 (= UTC 23:00 전날). GitHub Actions schedule cron 은
#       SLA 가 없어 5-15분 지연 또는 가끔 skip 이 발생 — start 누락 시 다음
#       Bicep deploy 가 Stopped state 의 PG 를 update 시도하면 InternalServerError.
#       이를 방지하기 위해 start cron 을 30분 간격 3중 보장 (어느 하나가 skip 돼도
#       다음 cron 에서 idempotent 하게 시작). state=Stopped 가드로 중복 호출 안전.
# Azure Flexible Server는 7일 무활동 시 자동 기동 정책 — 8시간 정지는 안전 범위
#
# 수동 실행: workflow_dispatch action 입력 (start | stop)

on:
  schedule:
    - cron: '0 15 * * *'   # KST 24:00 stop
    - cron: '0 23 * * *'   # KST 08:00 start (primary)
    - cron: '30 23 * * *'  # KST 08:30 start (backup 1, primary skip 대비)
    - cron: '0 0 * * *'    # KST 09:00 start (backup 2, 두 cron 모두 skip 대비)
  workflow_dispatch:
    inputs:
      action:
        description: '실행할 작업'
        required: true
        type: choice
        options:
          - stop
          - start

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-sohobi-prod
  PG_SERVER_NAME: sohobi-prod-pg

jobs:
  stop:
    # 무료 기간(~2027-05-27)에는 절감액 ₩0 이고 cron 지연으로 아침 장애만 생기므로 일정 정지를 끈다(상단 주석).
    if: (github.event.schedule == '0 15 * * *' && vars.PG_NIGHTLY_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'stop')
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_B }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_B }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_B }}

      - name: Stop PG Flexible Server
        run: |
          state=$(az postgres flexible-server show -g $AZURE_RESOURCE_GROUP -n $PG_SERVER_NAME --query state -o tsv)
          echo "Current state: $state"
          if [ "$state" = "Ready" ]; then
            az postgres flexible-server stop -g $AZURE_RESOURCE_GROUP -n $PG_SERVER_NAME
            echo "Stop initiated."
          else
            echo "Server not in Ready state — skip."
          fi

  start:
    # 3중 보장 cron: primary 가 skip 돼도 backup 1·2 가 잡음. state=Stopped 가드로 중복 호출은 silent skip.
    if: |
      github.event.schedule == '0 23 * * *' ||
      github.event.schedule == '30 23 * * *' ||
      github.event.schedule == '0 0 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'start')
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_B }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_B }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_B }}

      - name: Start PG Flexible Server
        run: |
          state=$(az postgres flexible-server show -g $AZURE_RESOURCE_GROUP -n $PG_SERVER_NAME --query state -o tsv)
          echo "Current state: $state"
          if [ "$state" = "Stopped" ]; then
            az postgres flexible-server start -g $AZURE_RESOURCE_GROUP -n $PG_SERVER_NAME
            echo "Start initiated."
          else
            echo "Server not in Stopped state — skip (already Ready or transitioning)."
          fi
