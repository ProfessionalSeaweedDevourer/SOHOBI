name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/azure-static-web-apps.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/azure-static-web-apps.yml"

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

# 2026-10-22~23 구 테넌트 정리로 옛 SWA(delightful-rock-0de6c000f)와 그 자격증명이 사라져 새 구독 SWA 로 옮겼다.
# SWA 는 infra/bicep/modules/static-web-app.bicep 이 만든다. 경위: docs/plans/2026-11-02-sohobi-net-outage-recovery.md
# 배포 토큰은 secret 에 두지 않고 새 테넌트 OIDC(*_B)로 로그인해 실행마다 SWA 에서 받는다.
# 백엔드 주소는 화면 번들에 들어가는 공개 값이라 여기 둔다.
env:
  SWA_NAME: sohobi-prod-swa
  RESOURCE_GROUP: rg-sohobi-prod
  BACKEND_URL: https://sohobi-backend.politefield-1cd9d809.koreacentral.azurecontainerapps.io

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          lfs: false

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_B }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_B }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_B }}

      - name: Check preview environment capacity
        id: preview_guard
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_PREVIEW_ENVIRONMENTS: "3"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$SWA_NAME" ] || [ -z "$RESOURCE_GROUP" ]; then
            echo "::warning::AZURE_SWA_NAME or AZURE_RESOURCE_GROUP is missing; deploying without preview capacity guard."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t ENV_NAMES < <(az staticwebapp environment list \
            --name "$SWA_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?name!='default'].name" -o tsv)

          ACTIVE_COUNT=0
          CURRENT_ENV_EXISTS=false

          for ENV_NAME in "${ENV_NAMES[@]}"; do
            [ -z "$ENV_NAME" ] && continue
            PR_NUM=""
            if [[ "$ENV_NAME" =~ ^pr-([0-9]+)(-|$) ]]; then
              PR_NUM="${BASH_REMATCH[1]}"
            elif [[ "$ENV_NAME" =~ ^([0-9]+)$ ]]; then
              PR_NUM="${BASH_REMATCH[1]}"
            fi
            if [ -z "$PR_NUM" ]; then
              echo "Environment $ENV_NAME has no PR number; counting it as active."
              ACTIVE_COUNT=$((ACTIVE_COUNT + 1))
              continue
            fi

            PR_STATE=$(gh pr view "$PR_NUM" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
            echo "Environment $ENV_NAME maps to PR #$PR_NUM ($PR_STATE)."

            if [ "$PR_STATE" = "CLOSED" ] || [ "$PR_STATE" = "MERGED" ]; then
              echo "Deleting stale environment $ENV_NAME for PR #$PR_NUM."
              az staticwebapp environment delete \
                --name "$SWA_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --environment-name "$ENV_NAME" \
                --yes
              continue
            fi

            ACTIVE_COUNT=$((ACTIVE_COUNT + 1))
            if [ "$PR_NUM" = "$PR_NUMBER" ]; then
              CURRENT_ENV_EXISTS=true
            fi
          done

          if [ "$CURRENT_ENV_EXISTS" = "true" ] || [ "$ACTIVE_COUNT" -lt "$MAX_PREVIEW_ENVIRONMENTS" ]; then
            echo "Preview environment capacity available ($ACTIVE_COUNT/$MAX_PREVIEW_ENVIRONMENTS active)."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Azure Static Web Apps preview deploy skipped because $SWA_NAME already has $ACTIVE_COUNT/$MAX_PREVIEW_ENVIRONMENTS active preview environments."
          echo "should_deploy=false" >> "$GITHUB_OUTPUT"

          MARKER="<!-- swa-preview-skipped -->"
          BODY=$(printf '%s\n%s\n\n%s\n%s\n' \
            "$MARKER" \
            "Azure Static Web Apps preview deploy was skipped." \
            "The Free SKU allows $MAX_PREVIEW_ENVIRONMENTS staging environments, and all preview slots are currently in use. This check is intentionally green so non-production preview capacity does not block the PR." \
            "Close or merge another frontend PR, rerun this workflow, or upgrade the SWA plan if more concurrent previews are needed.")
          COMMENT_ID=$(gh api "/repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | tail -1 || true)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "/repos/$REPO/issues/comments/$COMMENT_ID" -f body="$BODY" >/dev/null || true
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY" >/dev/null || true
          fi

      - name: Fetch SWA deployment token
        id: swa_token
        run: |
          set -euo pipefail
          TOKEN=$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" \
            --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Build And Deploy
        id: builddeploy
        if: github.event_name == 'push' || steps.preview_guard.outputs.should_deploy != 'false'
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_URL: ${{ env.BACKEND_URL }}
          # 백엔드 API_SECRET_KEY 와 같은 값이어야 한다(azure-bicep-deploy.yml 이 같은 secret 을 백엔드에 주입)
          VITE_API_KEY: ${{ secrets.API_SECRET_KEY }}
          VITE_DEV_PASSWORD_HASH: ${{ secrets.VITE_DEV_PASSWORD_HASH }}
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
          VITE_KAKAO_API_KEY: ${{ secrets.VITE_KAKAO_API_KEY }}
          VITE_VWORLD_API_KEY: ${{ secrets.VITE_VWORLD_API_KEY }}
          # VWorld 키에 등록된 도메인. 화면 주소와 별개로 백엔드 WMS 프록시가 이 값을 보낸다
          VITE_VWORLD_DOMAIN: sohobi.net
          VITE_MAP_URL: ${{ env.BACKEND_URL }}
          VITE_REALESTATE_URL: ${{ env.BACKEND_URL }}
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/frontend" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
