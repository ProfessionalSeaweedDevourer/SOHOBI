name: Azure Bicep Deploy

on:
  pull_request:
    paths:
      - 'infra/bicep/**'
      - '.github/workflows/azure-bicep-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'infra/bicep/**'
      - '.github/workflows/azure-bicep-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AZURE_RESOURCE_GROUP: rg-sohobi-prod
  # prod.bicepparam 이 readEnvironmentVariable 로 읽는 GitHub secret 이름. 값이 아니라 이름만 둔다.
  # secret 을 추가하면 이 목록, 아래 두 job 의 env, prod.bicepparam, main.bicep 을 함께 고친다.
  # 필수: 하나라도 비면 배포하지 않는다. API_SECRET_KEY 가 빈 리비전은 인증이 꺼진 채 뜬다(backend/auth.py).
  REQUIRED_SECRETS: >-
    PG_ADMIN_PASSWORD
    JWT_SECRET
    API_SECRET_KEY
  # 선택: 비어 있으면 해당 기능의 secret 과 env 없이 배포한다(지도 부가 기능, Google 로그인).
  OPTIONAL_SECRETS: >-
    VWORLD_API_KEY
    KAKAO_REST_KEY
    KTO_GW_INFO_KEY
    GOOGLE_CLIENT_ID
    GOOGLE_CLIENT_SECRET

jobs:
  what-if:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_B }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_B }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_B }}

      - name: Bicep what-if
        id: whatif
        env:
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KTO_GW_INFO_KEY: ${{ secrets.KTO_GW_INFO_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          # 미등록 secret 은 PR 코멘트 맨 앞에 이름만 적는다. 필수가 비면 머지 후 deploy job 이 같은 검사로 멈춘다.
          missing=""; skipped=""
          for k in $REQUIRED_SECRETS; do [ -n "${!k:-}" ] || missing="$missing $k"; done
          for k in $OPTIONAL_SECRETS; do [ -n "${!k:-}" ] || skipped="$skipped $k"; done
          : > whatif.txt
          if [ -n "$missing" ]; then
            echo "::warning::미등록 필수 GitHub secret:$missing"
            echo "경고: 미등록 필수 GitHub secret:$missing (이대로 머지하면 deploy job 이 배포 전에 멈춘다)" >> whatif.txt
          fi
          if [ -n "$skipped" ]; then
            echo "참고: 미등록 선택 GitHub secret:$skipped (해당 env 없이 배포된다)" >> whatif.txt
          fi
          az deployment group what-if \
            -g $AZURE_RESOURCE_GROUP \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/prod.bicepparam \
            --no-pretty-print >> whatif.txt 2>&1 || true
          {
            echo "result<<EOF"
            cat whatif.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment what-if on PR
        uses: actions/github-script@v7
        with:
          script: |
            const result = `${{ steps.whatif.outputs.result }}`;
            const body = `## Bicep what-if\n\n\`\`\`\n${result.slice(0, 60000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PG_SERVER_NAME: sohobi-prod-pg
      CONTAINER_APP_NAME: sohobi-backend
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_B }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_B }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_B }}

      # pg-nightly-stop.yml 의 start cron 이 GitHub Actions schedule 지연/skip 으로 안 돌면
      # PG 가 Stopped 상태로 남아 Bicep deploy 가 InternalServerError 로 실패.
      # deploy 전 PG state 확인 후 Stopped 면 즉시 start + Ready 까지 대기.
      - name: PG state guard (start if Stopped)
        run: |
          set -euo pipefail
          state=$(az postgres flexible-server show \
            -g "$AZURE_RESOURCE_GROUP" -n "$PG_SERVER_NAME" \
            --query state -o tsv 2>/dev/null || echo "Unknown")
          echo "Current PG state: $state"
          if [ "$state" = "Stopped" ]; then
            echo "PG is Stopped — starting before Bicep deploy."
            az postgres flexible-server start -g "$AZURE_RESOURCE_GROUP" -n "$PG_SERVER_NAME"
            for i in $(seq 1 30); do
              state=$(az postgres flexible-server show -g "$AZURE_RESOURCE_GROUP" -n "$PG_SERVER_NAME" --query state -o tsv)
              echo "  poll $i: state=$state"
              if [ "$state" = "Ready" ]; then
                echo "PG Ready — proceed."
                exit 0
              fi
              sleep 10
            done
            echo "FAIL — PG did not reach Ready state within 5 minutes." >&2
            exit 1
          elif [ "$state" = "Ready" ]; then
            echo "PG already Ready — proceed."
          else
            echo "PG state=$state (not Stopped/Ready) — Bicep deploy may fail. Proceeding anyway."
          fi

      - name: Bicep deploy
        env:
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KTO_GW_INFO_KEY: ${{ secrets.KTO_GW_INFO_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # 필수 secret 이 비면 secretRef 가 없는 secret 을 가리켜 배포가 거부되고, API_SECRET_KEY 가 빈 리비전은
          # 인증이 꺼진 채 뜬다(backend/auth.py). 어느 쪽이든 배포 전에 이름을 밝히고 멈춘다.
          missing=""; skipped=""
          for k in $REQUIRED_SECRETS; do [ -n "${!k:-}" ] || missing="$missing $k"; done
          for k in $OPTIONAL_SECRETS; do [ -n "${!k:-}" ] || skipped="$skipped $k"; done
          if [ -n "$missing" ]; then
            echo "::error::미등록 필수 GitHub secret:$missing (절차: docs/plans/2026-10-11-bicep-secrets-manual-actions.md)"
            exit 1
          fi
          if [ -n "$skipped" ]; then
            echo "::warning::미등록 선택 GitHub secret:$skipped (해당 env 없이 배포한다)"
          fi
          az deployment group create \
            -g $AZURE_RESOURCE_GROUP \
            --name foundation-${{ github.run_id }} \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/prod.bicepparam

      # Single revision 모드에서 'az deployment group create' 가 비활성화했던 구 리비전을 다시
      # active 로 되살리는 현상 방지 (2026-06-23 실측: budget 배포가 트래픽 0 좀비 리비전 0000008
      # 을 재활성 → 유휴 컴퓨트 재과금). 배포 직후 'active 인데 트래픽 0' 이고 latest 가 아닌
      # 리비전(=실서비스 아님)을 자동 deactivate 한다. ingress 가 latestRevision=true·weight=100
      # 이라 실서비스 리비전은 항상 traffic=100 → 오탐 없음. latest 는 어떤 경우에도 보존(안전장치).
      - name: Deactivate orphaned (0-traffic) revisions
        run: |
          set -euo pipefail
          latest=$(az containerapp revision list \
            -n "$CONTAINER_APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --query "reverse(sort_by([], &properties.createdTime))[0].name" -o tsv)
          echo "Latest revision (always kept): $latest"
          az containerapp revision list \
            -n "$CONTAINER_APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --query '[?properties.active && properties.trafficWeight==`0`].name' -o tsv \
          | while read -r rev; do
              [ -z "$rev" ] && continue
              if [ "$rev" = "$latest" ]; then
                echo "Skip latest: $rev"
                continue
              fi
              echo "Deactivating orphaned revision: $rev"
              az containerapp revision deactivate \
                -n "$CONTAINER_APP_NAME" -g "$AZURE_RESOURCE_GROUP" --revision "$rev" \
                || echo "::warning::deactivate failed for $rev"
            done
          echo "Orphan revision cleanup done."
