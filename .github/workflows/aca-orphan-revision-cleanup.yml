name: ACA Orphan Revision Cleanup

# 좀비 리비전 비용 재발 방지용 스케줄 청소 (band-aid).
#
# 배경: Single revision 모드의 sohobi-backend 에서 트래픽 0 인 구 리비전(예: 0000008)이
#       배포·활동로그와 무관하게 플랫폼 자체로 재활성되어 유휴 컴퓨트가 재과금된다
#       (2026-06-23 실측). azure-bicep-deploy.yml 의 deploy job 에 동일한 self-heal 스텝이
#       있으나 그것은 배포 시점에만 돌아 배포와 배포 사이에 공백이 생긴다. 이 워크플로가
#       그 공백을 6 시간 간격으로 메운다.
#
# 근본 해결은 별도(container-app.bicep livenessProbe → 0000009 Healthy 화로 fallback 차단).
# 그 효과가 검증되면 이 워크플로는 통째로 삭제한다.
#
# 로직은 azure-bicep-deploy.yml 의 "Deactivate orphaned (0-traffic) revisions" 스텝과
# 동일하다 (idempotent, latest 리비전은 어떤 경우에도 보존).

on:
  schedule:
    - cron: '0 */6 * * *'   # 6 시간 간격 (UTC 00/06/12/18)
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-sohobi-prod
  CONTAINER_APP_NAME: sohobi-backend

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_B }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_B }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_B }}

      # 'active 인데 트래픽 0' 이고 latest 가 아닌 리비전(=실서비스 아님)을 deactivate.
      # ingress 가 latestRevision=true·weight=100 이라 실서비스 리비전은 항상 traffic=100
      # → 오탐 없음. latest 는 안전장치로 항상 보존.
      - name: Deactivate orphaned (0-traffic) revisions
        run: |
          set -euo pipefail
          latest=$(az containerapp revision list \
            -n "$CONTAINER_APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --query "reverse(sort_by([], &properties.createdTime))[0].name" -o tsv)
          echo "Latest revision (always kept): $latest"
          az containerapp revision list \
            -n "$CONTAINER_APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --query '[?properties.active && properties.trafficWeight==`0`].name' -o tsv \
          | while read -r rev; do
              [ -z "$rev" ] && continue
              if [ "$rev" = "$latest" ]; then
                echo "Skip latest: $rev"
                continue
              fi
              echo "Deactivating orphaned revision: $rev"
              az containerapp revision deactivate \
                -n "$CONTAINER_APP_NAME" -g "$AZURE_RESOURCE_GROUP" --revision "$rev" \
                || echo "::warning::deactivate failed for $rev"
            done
          echo "Orphan revision cleanup done."
